name: Build LiteHEN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 xz-utils librsvg2-bin curl unzip clang lld

      - name: Download PS5 Payload SDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "ps5-payload-dev/sdk"
          latest: true
          fileName: "ps5-payload-sdk.zip"
          out-file-path: "/tmp"

      - name: Extract PS5 Payload SDK
        run: |
          mkdir -p "$HOME/ps5-sdk"
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "$HOME/ps5-sdk"

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /home/runner/ps5-sdk/ps5-payload-sdk
          LLVM_CONFIG: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-llvm-config
          CC: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang
          CXX: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang++
          # 🛡️ OTTIMIZZAZIONI ULTRA-RAM, ANTI-KP, MINIMO PESO E MASSIMA VELOCITÀ 🛡️
          CFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -fno-exceptions -fno-rtti -flto -s -ffunction-sections -fdata-sections"
          CXXFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -fno-exceptions -fno-rtti -flto -s -ffunction-sections -fdata-sections"
          LDFLAGS: "-flto -s -Wl,--gc-sections"
        run: |
          rm -rf build
          chmod +x ./scripts/*.sh
             
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            ./scripts/sync_dependencies.sh --init-submodules --stub-missing
          fi
          
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          if [ -f "source/util/source/ftp_server.cpp" ]; then
            sed -i 's/\bg_running\b/g_ftp_running/g' source/util/source/ftp_server.cpp
          fi

          # 🔄 CAMBIO PERCORSO SELETTIVO (SOLO NEI FILE DI CONFIGURAZIONE INTERNI) 🔄
          find source/ -type f -name "*settings*" -exec sed -i 's/OnionHEN/LiteHEN /g' {} + 2>/dev/null || true
          find source/ -type f -name "*settings*" -exec sed -i 's/onionHEN/LiteHEN /g' {} + 2>/dev/null || true
          if [ -f "source/shellui/src/toolbox_xml.cpp" ]; then
            sed -i 's/OnionHEN/LiteHEN /g' source/shellui/src/toolbox_xml.cpp 2>/dev/null || true
          fi

          ./scripts/build.sh --release

          # 🔍 RICERCA GLOBALE DELL'ESEGUIBILE 🔍
          # Crea la cartella di destinazione e cerca in tutto il workspace l'ELF finale generato
          mkdir -p build/bin
          FOUND_ELF=$(find . -type f -name "*.elf" ! -name "test.elf" ! -name "bootstrapper.elf" | head -n 1)
          
          if [ -n "$FOUND_ELF" ]; then
            echo "Trovato eseguibile in: $FOUND_ELF"
            cp "$FOUND_ELF" build/bin/LiteHEN.elf
          else
            echo "ATTENZIONE: Nessun file .elf trovato! Provo a cercare file generati di recente..."
            find . -type f -executable -mmin -5 -exec cp {} build/bin/LiteHEN.elf \; 2>/dev/null || true
          fi

      - name: Upload LiteHEN.elf
        uses: actions/upload-artifact@v4
        with:
          name: LiteHEN
          path: build/bin/LiteHEN.elf
