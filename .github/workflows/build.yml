name: Build LiteHEN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 xz-utils librsvg2-bin curl unzip clang lld

      - name: Download PS5 Payload SDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "ps5-payload-dev/sdk"
          latest: true
          fileName: "ps5-payload-sdk.zip"
          out-file-path: "/tmp"

      - name: Extract PS5 Payload SDK
        run: |
          mkdir -p "$HOME/ps5-sdk"
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "$HOME/ps5-sdk"

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /home/runner/ps5-sdk/ps5-payload-sdk
          LLVM_CONFIG: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-llvm-config
          CC: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang
          CXX: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang++
        run: |
          rm -rf build
          chmod +x ./scripts/*.sh
             
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            ./scripts/sync_dependencies.sh --init-submodules --stub-missing
          fi
          
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +

          # 🔥 OTTIMIZZAZIONI AGGRESSIVE: MENO PESO, MENO RAM, MASSIMA REATTIVITÀ 🔥
          OPTIMIZE_FLAGS="-Os -flto -s -ffunction-sections -fdata-sections -Wl,--gc-sections"
          find . -name "CMakeLists.txt" -exec sed -i "s/-O2/$OPTIMIZE_FLAGS/g" {} +
          find . -name "CMakeLists.txt" -exec sed -i "s/-O3/$OPTIMIZE_FLAGS/g" {} +
          find . -name "CMakeLists.txt" -exec sed -i "s/-Ofast/$OPTIMIZE_FLAGS/g" {} +

          if [ -f "source/util/source/ftp_server.cpp" ]; then
            sed -i 's/\bg_running\b/g_ftp_running/g' source/util/source/ftp_server.cpp
          fi

          # 🛠️ SOSTITUZIONE COMPLETA DELLE FUNZIONI MODIFICATE PER EVITARE GLI ERRORE DI SINTASSI 🛠️
          python3 -c '
import re

path = "source/shellui/src/toolbox_xml.cpp"
with open(path, "r", encoding="utf-8") as f:
    code = f.read()

# 1. Riscrive append_toolbox_pkg_group (PKG + Payload insieme, rimosso il secondo link)
pkg_pattern = r"void append_toolbox_pkg_group\s*\(\s*ps5ui::Group\s*&\s*g\s*\)\s*\{[\s\S]*?\}"
pkg_replacement = """void append_toolbox_pkg_group(ps5ui::Group& g) {
  g.link("id_game_package_installer", toolbox_i18n::tr("pkg.installer"), "PkgInstaller/data/pkginstaller.xml", "")
   .link("id_payloads", toolbox_i18n::tr("payloads.link"), "payloads.xml", "");
}"""
code = re.sub(pkg_pattern, pkg_replacement, code)

# 2. Riscrive append_toolbox_system_group (Rimosso l'\''interruttore ventola, lasciato solo il textfield e il link BD)
sys_pattern = r"void append_toolbox_system_group\s*\(\s*ps5ui::Group\s*&\s*g\s*\)\s*\{[\s\S]*?\}"
sys_replacement = """void append_toolbox_system_group(ps5ui::Group& g) {
  g.group(
       "id_group_fan", toolbox_i18n::tr("fan.group"),
       [](ps5ui::Group& f) {
         f.text_field("id_fan_speed", toolbox_i18n::tr("fan.threshold"),
                      std::nullopt, "number", "2", 
                      "2", std::nullopt, std::nullopt, std::nullopt,
                      toolbox_val("id_fan_speed", ""));
       },
       std::nullopt, std::nullopt, std::nullopt)
      .link("id_licenseactivation", toolbox_i18n::tr("license.bd"),
            "DebugSettings/data/debug_settings_licenseactivation.xml",
            "");
}"""
code = re.sub(sys_pattern, sys_replacement, code)

# 3. Riscrive la funzione principale generate_toolbox_xml ricollegando correttamente la catena dei metodi
gen_pattern = r"void generate_toolbox_xml\s*\(\s*std::string\s*&\s*new_xml\s*\)\s*\{[\s\S]*?\.build\s*\(\s*\)\s*;\s*\}"
gen_replacement = """void generate_toolbox_xml(std::string& new_xml) {
  ps5ui::Page page("id_debug_settings", toolbox_i18n::tr("root.title"));
  page.root_focus("id_group_pkg");

  new_xml = page.group(
          "id_group_pkg", toolbox_i18n::tr("group.pkg"),
          [](ps5ui::Group& g) { append_toolbox_pkg_group(g); },
          std::nullopt, std::nullopt,
          "id_game_package_installer")
      .group(
          "id_group_system", toolbox_i18n::tr("group.system"),
          [](ps5ui::Group& g) { append_toolbox_system_group(g); },
          std::nullopt, std::nullopt,
          "id_group_fan")
      .group(
          "id_onionhen_credit_options", toolbox_i18n::tr("group.about"),
          [](ps5ui::Group& g) { append_toolbox_about_group(g); },
          std::nullopt, std::nullopt, std::nullopt,
          ps5ui::Style::Center)
      .build();
}"""
code = re.sub(gen_pattern, gen_replacement, code)

with open(path, "w", encoding="utf-8") as f:
    f.write(code)
print("Sorgente toolbox_xml.cpp rigenerato con successo senza errori sintattici.")
'

          ./scripts/build.sh --release

          # Copiamo e rinominiamo direttamente l'eseguibile finale
          cp build/bin/OnionHEN.elf build/bin/LiteHEN.elf

      - name: Upload LiteHEN.elf
        uses: actions/upload-artifact@v4
        with:
          name: LiteHEN
          path: build/bin/LiteHEN.elf
