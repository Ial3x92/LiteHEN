name: Build LiteHEN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 xz-utils librsvg2-bin curl unzip clang lld

      - name: Download PS5 Payload SDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "ps5-payload-dev/sdk"
          latest: true
          fileName: "ps5-payload-sdk.zip"
          out-file-path: "/tmp"

      - name: Extract PS5 Payload SDK
        run: |
          mkdir -p "$HOME/ps5-sdk"
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "$HOME/ps5-sdk"

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /home/runner/ps5-sdk/ps5-payload-sdk
          LLVM_CONFIG: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-llvm-config
          CC: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang
          CXX: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang++
          # 🛡️ OTTIMIZZAZIONI AGGRESSIVE PER DIMENSIONE E STABILITÀ ANTI-KP 🛡️
          # Sostituito -Os con -Oz (Clang ottimizza ancora di più il peso)
          # Aggiunto -flto (Link Time Optimization) per fondere le librerie terze parti ed eliminare i duplicati
          CFLAGS: "-Oz -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections"
          CXXFLAGS: "-Oz -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections"
          LDFLAGS: "-flto -s -Wl,--gc-sections -Wl,--strip-all"
        run: |
          rm -rf build
          chmod +x ./scripts/*.sh
             
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            ./scripts/sync_dependencies.sh --init-submodules --stub-missing
          fi
          
          # Rimozione forzata di flag di Debug o Warning bloccanti in tutto il codice sorgente
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/-g//g' {} +
          
          if [ -f "source/util/source/ftp_server.cpp" ]; then
            sed -i 's/\bg_running\b/g_ftp_running/g' source/util/source/ftp_server.cpp
          fi

          # COMPILAZIONE FORZATA IN RELEASE CON FLAGS COMPATTI
          # Passiamo i flag direttamente a CMake per impedire che OnionTarget o preset interni li sovrascrivano
          cmake -B build -S source \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Oz -flto -s -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-Oz -flto -s -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto -s -Wl,--gc-sections -Wl,--strip-all"
          
          # Eseguiamo la compilazione effettiva tramite lo script nativo o direttamente con cmake
          if [ -f "./scripts/build.sh" ]; then
            ./scripts/build.sh --release
          else
            cmake --build build --config Release
          fi

          # Pulizia e Stripping manuale di sicurezza sui binari finali se il compilatore ha ignorato i flag
          if [ -f "build/bin/LiteHEN.elf" ]; then
            strip --strip-all build/bin/LiteHEN.elf || true
            echo "LiteHEN.elf generato nativamente."
          elif [ -f "build/bin/OnionHEN.elf" ]; then
            strip --strip-all build/bin/OnionHEN.elf || true
            cp build/bin/OnionHEN.elf build/bin/LiteHEN.elf
          else
            echo "Tentativo di fallback sui file generati..."
            cp build/bin/*.elf build/bin/LiteHEN.elf 2>/dev/null || true
            strip --strip-all build/bin/LiteHEN.elf || true
          fi

      - name: Upload LiteHEN.elf
        uses: actions/upload-artifact@v4
        with:
          name: LiteHEN
          path: build/bin/LiteHEN.elf
