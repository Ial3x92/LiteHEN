name: Build Lite_HEN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 xz-utils librsvg2-bin curl unzip clang lld

      - name: Download PS5 Payload SDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "ps5-payload-dev/sdk"
          latest: true
          fileName: "ps5-payload-sdk.zip"
          out-file-path: "/tmp"

      - name: Extract PS5 Payload SDK
        run: |
          mkdir -p "$HOME/ps5-sdk"
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "$HOME/ps5-sdk"

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /home/runner/ps5-sdk/ps5-payload-sdk
          LLVM_CONFIG: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-llvm-config
          CC: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang
          CXX: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang++
          # 🛡️ IMPOSTAZIONI ANTI-KP, MINIMO PESO, MINIMA RAM E MASSIMA VELOCITÀ 🛡️
          CFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections"
          CXXFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections"
          LDFLAGS: "-flto -s -Wl,--gc-sections"
        run: |
          rm -rf build
          chmod +x ./scripts/*.sh
             
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            ./scripts/sync_dependencies.sh --init-submodules --stub-missing
          fi
          
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          if [ -f "source/util/source/ftp_server.cpp" ]; then
            sed -i 's/\bg_running\b/g_ftp_running/g' source/util/source/ftp_server.cpp
          fi

          ./scripts/build.sh --release

          # Rileviamo automaticamente il file compilato (sia esso Lite_HEN o Lite_HEN) 
          # e standardizziamo il nome finale per l'upload in Lite_HEN.elf
          if [ -f "build/bin/Lite_HEN.elf" ]; then
            echo "Lite_HEN.elf generato nativamente."
          elif [ -f "build/bin/Lite_HEN.elf" ]; then
            cp build/bin/Lite_HEN.elf build/bin/Lite_HEN.elf
          else
            echo "Tentativo di fallback sui file generati..."
            cp build/bin/*.elf build/bin/Lite_HEN.elf 2>/dev/null || true
          fi

      - name: Upload Lite_HEN.elf
        uses: actions/upload-artifact@v4
        with:
          name: Lite_HEN
          path: build/bin/Lite_HEN.elf
