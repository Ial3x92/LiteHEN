name: Build LiteHEN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 xz-utils librsvg2-bin curl unzip clang lld

      - name: Download PS5 Payload SDK
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "ps5-payload-dev/sdk"
          latest: true
          fileName: "ps5-payload-sdk.zip"
          out-file-path: "/tmp"

      - name: Extract PS5 Payload SDK
        run: |
          mkdir -p "$HOME/ps5-sdk"
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "$HOME/ps5-sdk"

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /home/runner/ps5-sdk/ps5-payload-sdk
          LLVM_CONFIG: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-llvm-config
          CC: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang
          CXX: /home/runner/ps5-sdk/ps5-payload-sdk/bin/prospero-clang++
          # 🛡️ IMPOSTAZIONI ANTI-KP, MINIMO PESO, MINIMA RAM E MASSIMA VELOCITÀ 🛡️
          CFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections"
          CXXFLAGS: "-Os -fno-strict-aliasing -fno-omit-frame-pointer -flto -s -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti"
          LDFLAGS: "-flto -s -Wl,--gc-sections"
        run: |
          # Forza la cancellazione di ogni vecchia traccia o build precedente
          git clean -fdx || true
          rm -rf build
          chmod +x ./scripts/*.sh
             
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            ./scripts/sync_dependencies.sh --init-submodules --stub-missing
          fi
          
          # 🛑 TRANCIO NETTO DEL SERVER FTP DAL COMPILATORE 🛑
          if [ -f "source/util/CMakeLists.txt" ]; then
            sed -i 's/source\/ftp_server.cpp//g' source/util/CMakeLists.txt
            sed -i 's/ftp_server.cpp//g' source/util/CMakeLists.txt
          fi
          
          if [ -f "source/util/source/ftp_server.cpp" ]; then
            echo -n "" > source/util/source/ftp_server.cpp
          fi

          find source/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.hpp" -o -name "*.h" \) -exec sed -i 's/ftp_server_start/ \/\/ ftp_server_start/g' {} +
          find source/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.hpp" -o -name "*.h" \) -exec sed -i 's/start_ftp_server/ \/\/ start_ftp_server/g' {} +

          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          if [ -f "source/util/source/ftp_server.cpp" ]; then
            sed -i 's/\bg_running\b/g_ftp_running/g' source/util/source/ftp_server.cpp
          fi

          ./scripts/build.sh --release

          if [ -f "build/bin/LiteHEN.elf" ]; then
            echo "LiteHEN.elf generato nativamente."
          elif [ -f "build/bin/OnionHEN.elf" ]; then
            cp build/bin/OnionHEN.elf build/bin/LiteHEN.elf
          else
            echo "Tentativo di fallback sui file generati..."
            cp build/bin/*.elf build/bin/LiteHEN.elf 2>/dev/null || true
          fi

      - name: Upload LiteHEN.elf
        uses: actions/upload-artifact@v4
        with:
          name: LiteHEN
          path: build/bin/LiteHEN.elf
